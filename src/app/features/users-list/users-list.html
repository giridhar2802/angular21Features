<!-- Main container -->
<div class="container mx-auto py-8">
  <div class="bg-white shadow-lg rounded-lg">
    <div class="flex col-auto">
      <input type="text" placeholder="Search by name or email" (input)="searchQuery.set($event.target.value)" class="w-full p-3 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"/>
      
    </div>
  </div>
    <div class="overflow-x-auto bg-white shadow-lg rounded-lg">
      
      <!-- Table Header -->
      <table class="min-w-full table-auto text-left">
        <thead class="bg-blue-600 text-white">
          <tr>
            <th class="px-4 py-2 text-sm font-medium">First Name</th>
            <th class="px-4 py-2 text-sm font-medium">Last Name</th>
            <th class="px-4 py-2 text-sm font-medium">Maiden Name</th>
            <th class="px-4 py-2 text-sm font-medium">Email</th>
            <th class="px-4 py-2 text-sm font-medium">Phone</th>
          </tr>
        </thead>
        
        <!-- Table Body -->
        <tbody class="text-gray-700">
          <!-- Row 1 -->
           @for (item of userListSignal(); track $index) {
                <tr class="hover:bg-blue-200 hover:cursor-pointer" (click)="getUserDetails(item)">
                    <td class="px-4 py-2">{{ item.firstName }}</td>
                    <td class="px-4 py-2">{{ item.lastName }}</td>
                    <td class="px-4 py-2">{{ item.maidenName }}</td>
                    <td class="px-4 py-2">{{ item.email }}</td>
                    <td class="px-4 py-2">{{ item.phone }}</td>
                </tr>
           }
        </tbody>
      </table>
      <div class="flex justify-end">
        <!-- Pagination Block -->
        <button class="px-4 py-2 bg-gray-300 text-gray-700 rounded-l-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-50"
        (click)="paginate('prev')"
        [disabled]="page() === 1">Previous</button>
        <span>Count: {{totalRecords()}} Page: {{page()}}</span>
        <button class="px-4 py-2 bg-gray-300 text-gray-700 rounded-r-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-50"
        (click)="paginate('next')"
        >Next</button>
      </div>
    </div>
</div>
